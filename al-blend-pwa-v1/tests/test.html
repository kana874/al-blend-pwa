<!doctype html><meta charset="utf-8"><title>Al配合計算 テスト</title><style>body{font-family:sans-serif;padding:24px}pre{background:#f3f5f6;padding:16px;border-radius:8px}</style><h1>ブラウザ計算エンジンテスト</h1><pre id="out">実行中...</pre><script src="../js/vendor/decimal-lite.js"></script><script src="../js/calc-engine.js"></script><script>
const out=[];function ok(name,cond){out.push((cond?'PASS ':'FAIL ')+name);if(!cond)throw new Error(name)}
try{const E=CalcEngine,D=E.Decimal;ok('1 kg = 1000 g',E.massToGram('1','kg').eq('1000'));ok('1 ppm = 1e-6',E.concentrationToFraction('1','ppm').eq('0.000001'));const M=E.massToGram('500','kg'),C0=E.concentrationToFraction('2','ppm'),Ct=E.concentrationToFraction('50','ppm'),P=E.percentToFraction('99.999'),Y=E.percentToFraction('95'),x=E.calculateAdditionMass({meltMassG:M,currentFraction:C0,targetFraction:Ct,additiveFraction:P,yieldFraction:Y}),C1=E.calculateFinalConcentration({meltMassG:M,currentFraction:C0,additionMassG:x,additiveFraction:P,yieldFraction:Y});ok('添加量→最終濃度 往復',E.fractionToConcentration(C1,'ppm').sub('50').abs().lt('0.000000000001'));out.push('Sample theoretical addition: '+x.toFixed(9)+' g');document.getElementById('out').textContent=out.join('\n')}catch(e){out.push('ERROR '+e.message);document.getElementById('out').textContent=out.join('\n')}
</script>
